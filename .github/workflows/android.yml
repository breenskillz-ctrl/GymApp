# Builds the Android app (Capacitor wrapper in android-app/, DECISIONS #52).
# Every run uploads a debug APK for testing. When the signing secrets exist, it also builds a signed .aab for Google Play.
# Secrets (never in the repo): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
name: Android app

on:
  push:
    branches: [claude/gymkeeper-app-pq7o0u, wip-android]
    paths: [android-app/**, .github/workflows/android.yml]
  workflow_dispatch:

permissions:
  contents: write # to publish the test APK as a pre-release

concurrency:
  group: android-test
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install and sync web files
        run: |
          npm ci
          npm run sync

      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: gymapp-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # A fixed download link for the phone: .../releases/download/android-test/Loadlog-test.apk
      # The release is kept and only the file is replaced, so the link never disappears while a build is running.
      - name: Publish the test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Loadlog-test.apk
          if ! gh release view android-test >/dev/null 2>&1; then
            gh release create android-test --prerelease --target "$GITHUB_SHA" \
              --title "Loadlog for Android (test build)" \
              --notes "Test build for installing by hand. The Google Play version will replace it."
          fi
          gh release upload android-test Loadlog-test.apk --clobber
