# Deploys the app to GitHub Pages on every push to the deploy branch.
# The github-pages environment only allows deploys from `claude/gymkeeper-app-pq7o0u`
# (it was the default branch when Pages was enabled). Deploys from `main`/`Main` are rejected.
# Uses only the built-in GITHUB_TOKEN – no secrets required.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/gymkeeper-app-pq7o0u]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publish only the app files, not docs or repo config
      - name: Prepare site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js icons img _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
