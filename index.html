<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Workout log for strength training – log workouts, follow programs, track progress and use timers.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css?v=14">
</head>
<body>

      <symbol id="i-dumbbell" viewBox="0 0 24 24"><path d="M14.4 14.4 9.6 9.6M18.66 21.49a2 2 0 1 1-2.83-2.83l-1.77 1.77a2 2 0 1 1-2.83-2.83l6.37-6.37a2 2 0 1 1 2.83 2.83l-1.77 1.77a2 2 0 1 1 2.83 2.83zM21.5 21.5l-1.4-1.4M3.9 3.9 2.5 2.5M6.4 12.77a2 2 0 1 1-2.83-2.83l1.77-1.77a2 2 0 1 1-2.83-2.83l2.83-2.83a2 2 0 1 1 2.83 2.83l1.77-1.77a2 2 0 1 1 2.83 2.83z"/></symbol>

      <symbol id="i-comment" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></symbol>
      <symbol id="i-flex" viewBox="0 0 32 32"><circle cx="16" cy="9.5" r="2.8" fill="currentColor" stroke="none"/><path d="M12.3 13.5h7.4l-.9 8.2h-5.6z" fill="currentColor" stroke="none"/><path d="M12.6 14.2 8.2 13.2 6 8.4M19.4 14.2l4.4-1 2.2-4.8M13.4 21.7l-1 7.3M18.6 21.7l1 7.3" stroke-width="2.6"/><circle cx="5.8" cy="7.1" r="2" fill="currentColor" stroke="none"/><circle cx="26.2" cy="7.1" r="2" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-scale" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><rect x="8" y="6.5" width="8" height="4" rx="1"/><path d="M12 8.5l1.5-1"/></symbol>
    </defs>
  </svg>

  <main id="main" class="main"></main>

  <div id="restbar" class="restbar" aria-live="polite">
    <div class="rest-progress"></div>
    <div class="rest-inner">
      <span class="rest-label">Rest</span>
      <span class="rest-time">0:00</span>
      <button class="rest-btn" data-rest="-15">−15</button>
      <button class="rest-btn" data-rest="15">+15</button>
      <button class="rest-btn skip" data-rest="skip">Skip</button>
    </div>
  </div>

  <div id="drawer" class="drawer" aria-hidden="true">
    <nav class="drawer-panel">
      <div class="drawer-head">
        <img src="icons/icon.svg" alt="" width="40" height="40">
        <div><strong>GymApp</strong><span class="sub">Workout log</span></div>
      </div>
      <button data-view="log"><svg class="ico"><use href="#i-calendar"/></svg>Workout log</button>
      <button data-view="programs"><svg class="ico"><use href="#i-flex"/></svg>Programs &amp; blocks</button>
      <button data-view="exercises"><svg class="ico"><use href="#i-book"/></svg>Exercises</button>
      <button data-view="progress"><svg class="ico"><use href="#i-chart"/></svg>Progress &amp; records</button>
      <button data-view="timers"><svg class="ico"><use href="#i-timer"/></svg>Timers</button>
      <hr>
      <button data-drawer-act="body"><svg class="ico"><use href="#i-scale"/></svg>Body weight</button>
      <button data-drawer-act="settings"><svg class="ico"><use href="#i-settings"/></svg>Settings &amp; backup</button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="js/app.js?v=14"></script>
</body>
</html>
